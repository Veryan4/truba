mcpServers:
  news:
    type: "remote"
    url: "http://mcp"

# Application settings
model: "ollama/qwen3.5:9b"
max-steps: 10
debug: false
system-prompt: "./news-assistant.md"

# Model generation parameters
max-tokens: 4096
temperature: 0.7
top-p: 0.95
top-k: 40
stop-sequences: ["&---"]

# Streaming configuration
stream: false  

#provider-url: "http://ollama.default.svc.cluster.local"  
tls-skip-verify: true  